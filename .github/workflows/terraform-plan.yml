name: terraform-plan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  id-token: write   # REQUIRED for OIDC — without this, auth silently fails
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform   # adjust to where your .tf files live in the repo
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::015275788101:role/trip-briefing-cicd-plan
          aws-region: eu-central-1

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init
      - run: terraform plan -no-color